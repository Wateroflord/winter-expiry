name: winter_expiry
description: "Учёт просрочки для кассира: вода, пиво, энергетики."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mobile_scanner: ^6.0.0
  flutter_local_notifications: ^18.0.0
  timezone: any
  shared_preferences: ^2.3.0
  http: ^1.2.0
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A1020"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 23
